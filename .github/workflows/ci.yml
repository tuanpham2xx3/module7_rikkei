name: Backend CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doodlelife
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: doodlelife
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://doodlelife:ci_only@localhost:5432/doodlelife
      TEST_DATABASE_URL: postgresql://doodlelife:ci_only@localhost:5432/doodlelife
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run eval:b06
      - run: npm run migrate
      - run: npm run migrate
