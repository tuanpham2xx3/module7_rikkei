services:
  - type: web
    name: doodlelife-api
    runtime: docker
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IMAGE_SIGNING_SECRET
        generateValue: true
      - key: STORAGE_BUCKET
        value: stickers
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
  # Enable only after the C03/C04/C06 adapter is included in the build.
  # Run exactly one worker replica; concurrency below is per process.
  - type: worker
    name: doodlelife-worker
    runtime: docker
    dockerCommand: npm run worker
    envVars:
      - key: WORKER_DATABASE_URL
        sync: false
      - key: WORKER_ADAPTER_MODULE
        sync: false
      - key: WORKER_CONCURRENCY
        value: 2
      - key: WORKER_LEASE_MS
        value: 60000
      - key: WORKER_TIMEOUT_MS
        value: 30000
      - key: WORKER_POLL_MS
        value: 2000
      - key: WORKER_BACKOFF_MS
        value: 2000
      - key: WORKER_MAX_JOB_AGE_MS
        value: 600000
